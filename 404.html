<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sayfa bulunamadı — Antra Tech</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/gorseller/favicon.svg" type="image/svg+xml">
<style>
  @font-face { font-family: 'Fraunces'; src: url('/yazitipleri/fraunces/fraunces.woff2') format('woff2'); font-weight: 280 600; font-display: swap; }
  @font-face { font-family: 'Archivo'; src: url('/yazitipleri/archivo/archivo.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }
  :root { --lacivert: #151b38; --krem: #f3eee4; --krem-2: #b9b8c9; --kirmizi: #b8292b; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 1.5rem; background: var(--lacivert); color: var(--krem); font-family: 'Archivo', system-ui, sans-serif; }
  main { display: grid; gap: 1.5rem; justify-items: center; text-align: center; max-width: 34rem; }
  svg { width: min(100%, 26rem); height: auto; overflow: visible; }
  .iplik { fill: none; stroke: #e2585a; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 14 6; animation: ak 2.4s linear infinite; }
  .uc { fill: none; stroke: #e2585a; stroke-width: 1.4; stroke-linecap: round; }
  @keyframes ak { to { stroke-dashoffset: -40; } }
  .kod { font-family: ui-monospace, Consolas, monospace; font-size: .75rem; letter-spacing: .16em; color: var(--krem-2); text-transform: uppercase; }
  h1 { margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 380; font-size: clamp(2.25rem, 1.4rem + 4vw, 3.75rem); line-height: 1.05; letter-spacing: -.02em; }
  p { margin: 0; color: var(--krem-2); line-height: 1.6; }
  a { display: inline-flex; align-items: center; min-height: 48px; padding: .7rem 1.4rem; border-radius: 999px; background: var(--kirmizi); color: #fff; font-weight: 600; text-decoration: none; transition: background-color 200ms; }
  a:hover { background: #962023; }
  a:focus-visible { outline: 2px solid var(--krem); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { .iplik { animation: none; } }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 420 120" aria-hidden="true">
    <path class="iplik" d="M0 70 C60 70 90 40 150 52 S190 70 196 64"/>
    <path class="uc" d="M196 64 l8 -6 M196 64 l9 2 M196 64 l6 8"/>
    <path class="iplik" d="M232 58 C250 46 290 82 340 66 S400 60 420 60"/>
    <path class="uc" d="M232 58 l-9 -3 M232 58 l-7 7 M232 58 l-3 -9"/>
  </svg>
  <p class="kod" id="kod">404 · İplik koptu</p>
  <h1 id="baslik">Aradığınız sayfa bu kumaşta yok</h1>
  <p id="metin">Bağlantı eski ya da yanlış yazılmış olabilir. Ana sayfadan devam edebilirsiniz.</p>
  <a href="/" id="don">Ana sayfaya dön</a>
</main>
<script>
  /* ana sayfayla aynı dil kuralı: ?dil → kayıtlı tercih → tarayıcı dili */
  var dil = new URLSearchParams(location.search).get('dil'), kayit = null;
  try { kayit = localStorage.getItem('antratech-dil'); } catch (e) {}
  if (dil !== 'tr' && dil !== 'en') dil = (kayit === 'tr' || kayit === 'en') ? kayit : (/^tr/i.test(navigator.language || 'tr') ? 'tr' : 'en');
  if (dil === 'en') {
    document.documentElement.lang = 'en';
    document.title = 'Page not found — Antra Tech';
    document.getElementById('kod').textContent = '404 · Broken thread';
    document.getElementById('baslik').textContent = 'This page is not woven into our fabric';
    document.getElementById('metin').textContent = 'The link may be old or mistyped. You can continue from the home page.';
    document.getElementById('don').textContent = 'Back to home';
    document.getElementById('don').setAttribute('href', '/?dil=en');
  }
</script>
</body>
</html>
